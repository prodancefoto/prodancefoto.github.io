<script>
  (function(){
    var els=document.querySelectorAll('.reveal');
    if(!('IntersectionObserver'in window)){els.forEach(function(e){e.classList.add('in')});return;}
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});
    },{threshold:.12});
    els.forEach(function(e){io.observe(e);});
  })();
</script>
<script>
(function(){
 var toggle=document.getElementById('menuToggle');
 var nav=document.getElementById('siteNav');
 if(toggle&&nav){
  toggle.addEventListener('click',function(){var open=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!open));toggle.setAttribute('aria-label',open?'打开导航菜单':'关闭导航菜单');nav.classList.toggle('is-open',!open);});
  nav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','打开导航菜单');nav.classList.remove('is-open');});});
 }
})();
</script>
<script>
/* 灯箱：点击图集图片放大；再次点图片在「适应屏幕 / 原图尺寸」间切换；点空白或 ✕ 关闭 */
(function(){
  var lb=document.getElementById('lightbox');
  if(!lb) return;
  var img=lb.querySelector('img');
  function openLightbox(src,alt){
    img.src=src; img.alt=alt||'';
    lb.classList.add('open'); lb.classList.remove('zoomed');
    lb.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
  }
  function closeLightbox(){
    lb.classList.remove('open','zoomed');
    lb.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
  }
  document.querySelectorAll('.tile img').forEach(function(t){
    t.style.cursor='zoom-in';
    t.addEventListener('click',function(){ openLightbox(t.currentSrc||t.src, t.alt); });
  });
  lb.addEventListener('click',function(e){
    if(e.target===img){ lb.classList.toggle('zoomed'); }
    else{ closeLightbox(); }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeLightbox(); });
})();
</script>
